const $=s=>document.querySelector(s);let role='athlete',page='home';const key='forma-demo-v1';let state=JSON.parse(localStorage.getItem(key)||'null')||{logs:[],bookings:[],requests:[],files:[]};const athletes=[['Andrea Lombardi','AL','Forza e condizionamento','3/4 sessioni'],['Giulia Ferri','GF','Preparazione mezza maratona','2/3 sessioni'],['Marco Rossi','MR','Ricomposizione corporea','3/3 sessioni'],['Sofia Bianchi','SB','Preparazione atletica tennis','1/3 sessioni']];let db;const dbReady=new Promise(resolve=>{const r=indexedDB.open('forma-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>resolve()});
function save(){localStorage.setItem(key,JSON.stringify(state))}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function changeRole(v){role=v;page='home';document.querySelectorAll('.role').forEach(s=>s.value=v);$('#username').textContent=v==='coach'?'Luca Moretti':'Andrea Lombardi';$('#usertype').textContent=v==='coach'?'Preparatore atletico':'Atleta · Piano Performance';render()}function go(p){if(p==='athletes'&&!requireDemoRole('coach'))return;page=p;render();window.scrollTo(0,0)}
function navIcon(name){const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',plans:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',bookings:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M7 15h2m4 0h2"/>',diary:'<path d="M5 4h14v17H5zM9 2v4m6-4v4M9 11h6m-6 4h4"/>',progress:'<path d="M4 4v16h16M7 15l4-5 4 2 5-7"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6m-3 0v3m6 2 2-2"/>',athletes:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 4a6 6 0 0 1 3 5"/>'};return `<svg class="nav-icon" viewBox="0 0 24 24">${paths[name]||paths.home}</svg>`;}
function render(){const nav=role==='athlete'?[['home','⌂','Panoramica'],['plans','▤','Le mie schede'],['bookings','▦','Prenotazioni'],['diary','◷','Diario allenamenti'],['progress','↗','Progressi'],['timer','◴','Timer']]:[['home','⌂','Panoramica'],['athletes','♙','Atleti'],['plans','▤','Schede e richieste'],['bookings','▦','Agenda'],['diary','◷','Allenamenti'],['timer','◴','Timer']];$('#nav').innerHTML=nav.map(([p,i,t])=>`<button aria-label="${t}" aria-current="${page===p?'page':'false'}" class="${page===p?'active':''}" onclick="go('${p}')"><i aria-hidden="true">${navIcon(p)}</i><span class="nav-label-desktop">${t}</span><span class="nav-label-mobile">${({home:'Home',plans:'Schede',bookings:'Agenda',diary:'Diario',progress:'Progressi',athletes:'Atleti',timer:'Timer'})[p]}</span></button>`).join('');$('#crumb').textContent=nav.find(x=>x[0]===page)?.[2]||'Panoramica';$('#app').innerHTML=page==='home'?home():page==='plans'?plans():page==='bookings'?bookings():page==='diary'?diary():page==='athletes'?clients():page==='timer'?timerPage():progress();timerUpdate()}
function heading(t,s,btn=''){return `<div class="heading"><div><h1>${t}</h1><p class="small">${s}</p></div>${btn}</div>`}function action(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}
function home(){const coach=role==='coach';return heading(coach?'Ogni atleta, un percorso.':'Ciao Andrea, si riparte. ☀',coach?'Uno sguardo al tuo studio e ai progressi dei tuoi atleti.':'La costanza di oggi è il risultato di domani.',action(coach?'+ Carica scheda':'+ Registra allenamento',coach?'upload()':'logForm()'))+`<div class="grid"><section class="hero"><div class="eyebrow">${coach?'IL TUO STUDIO, IN MOVIMENTO':'IL TUO OBIETTIVO, PIÙ VICINO'}</div><span class="pill">${coach?'4 atleti attivi':'SETTIMANA 03 / 06'}</span><h2>${coach?'Il metodo incontra<br>i loro progressi.':'Costruiamo la tua<br>versione più forte.'}</h2><p>${coach?'Programma, ascolta e accompagna ogni allenamento.':'Il tuo programma di forza e condizionamento ti aspetta.'}</p><button onclick="go('${coach?'athletes':'plans'}')">${coach?'Gestisci i tuoi atleti':'Vai alla tua programmazione'} <span style="margin-left:24px"><svg class="inline-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></span></button></section>${agendaNextCard()}</div><div class="stats"><div class="card stat"><div class="top"><span>${coach?'Atleti attivi':'Allenamenti del mese'}</span><span>◷</span></div><strong>${coach?4:8+state.logs.length} <span>${coach?'percorsi':'/ 12 previsti'}</span></strong><div class="trend">${coach?'4 obiettivi, un unico metodo':'↗ Stai costruendo una buona abitudine'}</div></div><div class="card stat"><div class="top"><span>${coach?'Richieste schede':'Tempo di allenamento'}</span><span>◴</span></div><strong>${coach?state.requests.length:Math.round(385+state.logs.reduce((a,l)=>a+Number(l.duration),0))} <span>${coach?'da gestire':'min questo mese'}</span></strong><div class="small">${coach?'Tutte le richieste in un posto':'Ogni minuto conta.'}</div></div><div class="card stat"><div class="top"><span>${coach?'Sessioni in agenda':'Aderenza al programma'}</span><span><svg class="inline-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></span></div><strong>${coach?agendaData.reservations.filter(r=>r.status==='confirmed'&&agendaIsFuture(r)).length:Math.min(100,75+state.logs.length*5)}<span>${coach?' in programma':'%'}</span></strong><div class="trend">${coach?'Controlla le prossime disponibilità':'Un buon ritmo. Continua così.'}</div></div></div><div class="below"><section class="card"><div class="sectionhead"><div><h2>${coach?'I tuoi atleti':'La tua settimana'}</h2><p class="small">${coach?'Percorsi diversi, attenzione su misura.':'16 – 22 novembre · Forza e condizionamento'}</p></div><button class="textbtn" onclick="go('${coach?'athletes':'plans'}')">Vedi tutto →</button></div>${coach?athletes.slice(0,3).map(a=>athleteRow(a)).join(''):workout('A','Full body · Forza','Lunedì · 6 esercizi · 55 min','Da completare')+workout('B','Lower body & core','Mercoledì · 5 esercizi · 45 min','In programma')+`<p class="small" style="margin-top:20px">PROGRAMMA SETTIMANALE <span style="float:right">2 di 3 sessioni</span></p><div class="progress"><div></div></div>`}</section><section class="card"><h2>${coach?'Una visione condivisa':'La costanza fa la differenza'}</h2><p class="small" style="margin-top:5px">${coach?'Dai spazio anche al feedback dei tuoi atleti.':'Il tuo movimento, giorno dopo giorno.'}</p><div class="days">${['L','M','M','G','V','S','D'].map((d,i)=>`<div class="day">${d}<b class="${i===0?'today':i===2||i===4?'done':''}">${i===0?'16':i===2||i===4?'✓':16+i}</b></div>`).join('')}</div><div class="quote">“Non serve fare tutto in un giorno.<br>Serve fare un piccolo passo, ogni giorno.”<p class="small" style="margin-top:10px">— Luca, il tuo preparatore</p></div><button class="textbtn" style="margin-top:20px" onclick="go('${coach?'diary':'progress'}')">${coach?'Leggi i diari allenamento':'Esplora i tuoi progressi'} →</button></section></div>`}
function workout(letter,title,sub,status){return `<div class="workout"><div class="workicon">${letter}</div><div class="details"><span class="badge">${status}</span><h3>${title}</h3><p class="small">${sub}</p></div><button class="light" onclick="viewPlan('${letter}')" aria-label="Apri ${title}"><svg class="inline-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button></div>`}

function athleteRow(a){return `<div class="row" style="margin-top:12px"><span class="avatar">${a[1]}</span><div class="grow"><h3>${a[0]}</h3><p class="small">${a[2]}</p></div><span class="badge">${a[3]}</span><button class="light" onclick="clientDetail('${a[1]}')"><svg class="inline-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button></div>`}function clients(){return heading('I tuoi atleti','Obiettivi, programmi e allenamenti in un unico spazio.')+athletes.map(athleteRow).join('')}
function bookings(){return agendaPage()}
function diary(){return heading(role==='coach'?'Diario degli atleti':'Il mio diario','Durata effettiva, serie, ripetizioni e sensazioni dopo ogni sessione.',role==='athlete'?action('+ Registra allenamento','logForm()'):'')+`<div class="list">${state.logs.map((l,i)=>`<div class="row"><div class="workicon">✓</div><div class="grow"><span class="badge">${esc(l.date)}</span><h3 style="margin:8px 0">${esc(l.title)}</h3><p class="small">Andrea Lombardi · ${l.duration} min · Sforzo ${l.rpe}/10</p><p class="small">${esc(l.exercise)} · ${l.sets} serie × ${l.reps} ripetizioni · ${l.weight} kg</p>${l.notes?`<p class="small">${esc(l.notes)}</p>`:''}</div>${role==='athlete'?action('Elimina',`deleteLog(${i})`,'light'):''}</div>`).join('')||'<div class="card empty">Il diario è pronto per il tuo primo allenamento.<br>Registra una sessione per vedere i dati anche nella vista preparatore.</div>'}</div>`}
function progress(){return heading('I tuoi progressi','Il percorso si misura nella costanza, prima che nei numeri.')+`<div class="grid"><section class="card"><h2>Sessioni settimanali</h2><p class="small">Dati di esempio + allenamenti registrati nella demo</p><div class="chart">${[2,3,2,3+state.logs.length].map((v,i)=>`<div style="height:${Math.min(100,v*20)}%"><span>S${i+1} · ${v}</span></div>`).join('')}</div></section><section class="card"><h2>Il tuo obiettivo</h2><p style="margin-top:18px">Migliorare forza e resistenza</p><p class="small">3 allenamenti settimanali · Percorso di 6 settimane</p><div class="progress"><div style="width:50%"></div></div><p class="small" style="margin-top:12px">Settimana 3 di 6</p></section></div>`}
function modal(t,body){$('#modal').innerHTML=`<div class="modalhead"><h2>${t}</h2><button class="close" onclick="document.querySelector('dialog').close()" aria-label="Chiudi">×</button></div>${body}`;$('#modal').showModal()}function close(){ $('#modal').close();save();render()}
function logForm(){if(!requireDemoRole('athlete'))return;modal('Registra allenamento',`<form onsubmit="submitLog(event)"><label for="field1">Sessione</label><select id="field1" name="title"><option>Full body · Forza</option><option>Lower body & core</option><option>Allenamento libero</option></select><div class="fields"><div><label for="field2">Data</label><input id="field2" name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label for="field3">Durata effettiva (min)</label><input id="field3" name="duration" type="number" min="1" max="600" value="50" required></div></div><label for="field4">Esercizio eseguito</label><input id="field4" name="exercise" placeholder="Es. Squat con bilanciere" required><div class="fields"><div><label for="field5">Serie</label><input id="field5" name="sets" type="number" min="1" max="100" value="3" required></div><div><label for="field6">Ripetizioni per serie</label><input id="field6" name="reps" type="number" min="1" max="1000" value="10" required></div></div><div class="fields"><div><label for="field7">Carico (kg, 0 a corpo libero)</label><input id="field7" name="weight" type="number" min="0" max="1000" step="0.5" value="0" required></div><div><label for="field8">Sforzo percepito (1–10)</label><input id="field8" name="rpe" type="number" min="1" max="10" value="7" required></div></div><label for="field9">Note e sensazioni</label><textarea id="field9" name="notes" placeholder="Come è andata?"></textarea><button class="submit">Salva nel diario</button><p class="small" style="margin-top:10px">Salvato solo su questo browser, senza sincronizzazione.</p></form>`)}function submitLog(e){e.preventDefault();if(!requireDemoRole('athlete'))return;state.logs.unshift(Object.fromEntries(new FormData(e.target)));close();toast('Allenamento salvato nel diario')}
function bookingForm(){go('bookings');agendaFindNext()}
function requestForm(){if(!requireDemoRole('athlete'))return;modal('Richiedi una scheda',`<form onsubmit="submitRequest(event)"><label for="field15">Obiettivo</label><select id="field15" name="goal"><option>Forza e condizionamento</option><option>Migliorare la resistenza</option><option>Preparazione per una gara</option><option>Nuova programmazione personalizzata</option></select><label for="field16">Disponibilità e attrezzatura</label><textarea id="field16" name="notes" required placeholder="Es. 3 giorni a settimana, 45 minuti, palestra attrezzata"></textarea><button class="submit">Invia richiesta demo</button></form>`)}function submitRequest(e){e.preventDefault();if(!requireDemoRole('athlete'))return;state.requests.unshift({...Object.fromEntries(new FormData(e.target)),status:'In attesa'});close();toast('Richiesta salvata')}function acceptRequest(i){if(!requireDemoRole('coach'))return;state.requests[i].status='In preparazione';save();render();toast('Richiesta presa in carico')}
function upload(){if(!requireDemoRole('coach'))return;modal('Carica una scheda',`<form onsubmit="submitFile(event)"><label for="field17">Assegna a un atleta</label><select id="field17" name="athlete">${athletes.map(a=>`<option>${a[0]}</option>`).join('')}</select><label for="field18">Titolo della scheda</label><input id="field18" name="title" required placeholder="Es. Programma forza — Settimane 1–6"><label for="field19">PDF o documento (massimo 15 MB)</label><input id="field19" class="fileinput" name="file" type="file" accept=".pdf,.doc,.docx,.xlsx,.txt,.png,.jpg,.jpeg" required><div class="hint">Il file resta su questo dispositivo. La vista atleta mostra i documenti assegnati ad Andrea Lombardi. Non è ancora una condivisione online.</div><button class="submit">Carica e assegna</button></form>`)}async function submitFile(e){e.preventDefault();if(!requireDemoRole('coach'))return;await dbReady;if(!requireDemoRole('coach'))return;const data=new FormData(e.target),file=data.get('file');if(file.size>15*1024*1024)return toast('Il file supera il limite di 15 MB');if(!db)return toast('Archivio locale non disponibile in questo browser');const id=crypto.randomUUID(),t=db.transaction('files','readwrite');t.objectStore('files').put(file,id);t.oncomplete=()=>{state.files.push({id,name:data.get('title'),filename:file.name,athlete:data.get('athlete')});close();toast('Scheda caricata e assegnata')};t.onerror=()=>toast('Salvataggio non riuscito: spazio locale insufficiente')}async function openFile(id){await dbReady;if(!db)return toast('Archivio locale non disponibile');const r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{if(!r.result)return toast('File non più presente sul dispositivo');const u=URL.createObjectURL(r.result);modal('Documento',`<p>${esc(r.result.name)}</p><a href="${u}" target="_blank" rel="noopener" style="display:block;margin-top:20px">Apri il documento ↗</a><a href="${u}" download="${esc(r.result.name)}" style="display:block;margin-top:20px">Scarica file ↓</a>`)}}
const exercisePlans={
A:[{id:'riscaldamento_generale',name:'Riscaldamento',detail:'8 min · mobilità e attivazione',work:480,rest:0},{id:'squat_bilanciere',name:'Squat con bilanciere',detail:'3 serie × 10 ripetizioni · recupero 90 s',rest:90},{id:'panca_piana',name:'Panca piana',detail:'3 × 10 · recupero 90 s',rest:90},{id:'rematore_manubri',name:'Rematore con manubri',detail:'3 × 12 · recupero 60 s',rest:60},{id:'affondi_alternati',name:'Affondi alternati',detail:'3 × 10 per lato · recupero 60 s',rest:60},{id:'plank_frontale',name:'Plank',detail:'3 × 40 secondi · recupero 45 s',work:40,rest:45}],
B:[{id:'riscaldamento_anche_caviglie',name:'Riscaldamento',detail:'7 min · mobilità anca e caviglie',work:420,rest:0},{id:'stacco_rumeno',name:'Stacco rumeno',detail:'3 × 10 · recupero 90 s',rest:90},{id:'split_squat',name:'Split squat',detail:'3 × 10 per lato · recupero 60 s',rest:60},{id:'leg_curl_prono',name:'Leg curl',detail:'3 × 12 · recupero 60 s',rest:60},{id:'dead_bug',name:'Dead bug',detail:'3 × 12 · recupero 45 s',rest:45}]};
function planExerciseTimer(letter,index,phase){const ex=exercisePlans[letter][index];timerFromExercise(ex.name,phase==='work'?ex.work:ex.rest,phase==='work'?'Lavoro':'Recupero');}
function viewPlan(letter='A'){modal(letter==='B'?'Sessione B · Lower body & core':'Sessione A · Full body',`<span class="badge">Programma dimostrativo · Settimana 3</span><p class="small" style="margin:14px 0">Durata prevista: ${letter==='B'?45:55} minuti. Seleziona un timer per seguire i tempi previsti. Gli esercizi a ripetizioni hanno il timer di recupero.</p>${exercisePlans[letter].map((x,i)=>`<div class="exercise"><div class="exercise-name-row"><div><b>${x.name}</b><span class="small">${x.detail}</span></div><button class="exercise-info" aria-label="Come eseguire ${x.name}" aria-haspopup="dialog" onclick="openExerciseGuide('${x.id}','${letter}',${i})"><span aria-hidden="true">i</span></button></div><div class="exercise-timers">${x.work?`<button onclick="planExerciseTimer('${letter}',${i},'work')">Timer lavoro · ${timerFormat(x.work*1000)}</button>`:''}${x.rest?`<button onclick="planExerciseTimer('${letter}',${i},'rest')">Timer recupero · ${x.rest} s</button>`:''}</div></div>`).join('')}${role==='athlete'?`<button class="submit" onclick="document.querySelector('dialog').close();logForm()">Registra i risultati</button>`:''}`)}function clientDetail(id){const a=athletes.find(a=>a[1]===id);modal(a[0],`<span class="badge">Profilo dimostrativo</span><h3 style="margin:20px 0 8px">${a[2]}</h3><p class="small">Sessioni settimanali: ${a[3]}<br>Preparatore: Luca Moretti<br>Programmazione: 16 novembre – 27 dicembre</p>${id==='AL'?`<div class="hint">${state.logs.length} allenamenti registrati nella demo · ${state.files.filter(f=>f.athlete===a[0]).length} documenti assegnati</div>`:'<div class="hint">I dati di questo atleta sono dimostrativi.</div>'}${id==='AL'?`<button class="submit" onclick="document.querySelector('dialog').close();go('diary')">Visualizza diario allenamenti</button>`:'<p class="small" style="margin-top:15px">Nessun allenamento registrato per questo atleta.</p>'}`)}function deleteLog(i){if(!requireDemoRole('athlete'))return;modal('Eliminare questo allenamento?',`<p>Il dato verrà rimosso dal diario locale.</p><button class="submit" onclick="state.logs.splice(${i},1);close();toast('Allenamento eliminato')">Elimina allenamento</button>`)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
